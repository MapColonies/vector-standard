{{- $tracingUrl := include "api.tracingUrl" . -}}
{{- $metricsUrl := include "api.metricsUrl" . -}}
{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
data:
  SERVER_PORT: {{ .Values.env.targetPort | quote }}

  LOG_LEVEL: {{ .Values.env.logLevel | quote }}
  LOG_PRETTY_PRINT_ENABLED: {{ .Values.env.logPrettyPrintEnabled | quote }}

  {{- with .Values.env.tracing }}
  TELEMETRY_TRACING_ENABLED: {{ .enabled | quote }}
  {{- if .enabled }}
  TELEMETRY_TRACING_URL: {{ $tracingUrl | quote }}
  TELEMETRY_TRACING_RATIO: {{ .ratio | quote }}
  {{- end }}
  {{- end }}

  {{- with .Values.env.metrics }}
  TELEMETRY_METRICS_ENABLED: {{ .enabled | quote }}
  {{- if .enabled }}
  TELEMETRY_METRICS_URL: {{ $metricsUrl | quote }}
  {{- end }}
  {{- end }}

  REQUEST_PAYLOAD_LIMIT: {{ .Values.env.requestPayloadLimit | quote }}
  RESPONSE_COMPRESSION_ENABLED: {{ .Values.env.responseCompressionEnabled | quote }}

  {{- with .Values.db }}
  DB_HOST: {{ .host | quote }}
  DB_PORT: {{ .port | quote }}
  DB_USERNAME: {{ .username | quote }}
  DB_NAME: {{ .database | quote }}
  DB_SCHEMA: {{ .schema | quote }}
  DB_TYPE: {{ .type | quote }}
  DB_ENABLE_SSL_AUTH: {{ .sslAuth.enabled | quote }}
  {{- if .sslAuth.enabled }}
  DB_CA_PATH: {{ .sslAuth.root | quote }}
  DB_CERT_PATH: {{ .sslAuth.cert | quote }}
  DB_KEY_PATH: {{ .sslAuth.key | quote }}
  {{- end }}
  {{- end }}


  npm_config_cache: /tmp/
{{- end }}
