{{- if .Values.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "synchronizer.fullname" . }}-layers
  labels:
    {{- include "synchronizer.labels" . | nindent 4 }}
data:
  {{- range .Values.namespaces }}
  {{ .name }}.json: {{ .layers | toPrettyJson | quote }}
  {{- end }}
{{- end }}
