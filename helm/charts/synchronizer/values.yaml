enabled: true
replicaCount: 1
revisionHistoryLimit: 5
resetOnConfigChange: false

nameOverride: ""
fullnameOverride: ""

cloudProvider:
  dockerRegistryUrl: ""
  imagePullSecretName: ""

image:
  repository: standard-synchronizer
  pullPolicy: Always
  tag: "v1.0.0"

caSecretName: ''
caPath: '/usr/local/share/destination/ca-certificates'
caKey: 'ca.crt'

startupProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 30

livenessProbe:
  enabled: true
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  path: /liveness

readinessProbe:
  enabled: true
  initialDelaySeconds: 0
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  path: /liveness

namespaces:
  - name: default
    bucket: ""
    layers:
      - layerName: buildings_polygon
        enums: [code, attribute, sensitivity, building_type, status]
      - layerName: borders_polygon
        enums: [code, attribute]
    db:
      host: localhost
      port: 5432
      username: postgres
      password: postgres
      database: postgres
      schema: public
      type: postgres
      sslSecretName: secret-name
      ssl:
        enabled: false
        ca: ""
        cert: ""
        key: ""
    layerSource:
      type: sharedLua
      fileName: mock-query.lua
      layersVariable: layers
      aliasFieldName: alias
      idFieldName: id
      nameFieldName: name
      enrichment:
        enabled: false
        api: ""
        propertiesPath: ""
        aliasField: ""
        requestTimeoutMilliseconds: 5000

aliases: {}

typeMap:
  enabled: false
  data:
    types: {}
    geometrySubTypes: {}

env:
  port: 80
  targetPort: 8080
  protocol: TCP
  logLevel: info
  logPrettyPrintEnabled: false
  tracing:
    enabled: false
    url: http://localhost:4318/v1/traces
    ratio: 1
  metrics:
    enabled: false
    url: http://localhost:55681/v1/metrics
  schedule: '0 0 * * *'
  indexNameFormat: '{layerName}_{column}_idx'
  layersDir: /usr/src/app/packages/synchronizer/dist/config/layers
  aliasesFile: /usr/src/app/packages/synchronizer/dist/config/aliases/aliases.json
  typeMapFile: /usr/src/app/packages/synchronizer/dist/config/typeMap/typeMap.json

dbs:
  s3:
    endpoint: ""
    region: us-east-1
    forcePathStyle: true
    sslEnabled: false
    sigVersion: v4
    storageClass: STANDARD
    accessKey: ""
    secretKey: ""
  destinationDb:
    host: localhost
    port: 5432
    username: postgres
    password: postgres
    database: postgres
    schema: public
    type: postgres
    sslAuth:
      enabled: false
      secretName: secret-name
      cert: ""
      key: ""
      root: ""

resources:
  enabled: true
  value:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

nodePort: 30081

mclabels:
  owner: vector
  partOf: vector-standard
  component: backend
  logScraping: true
  prometheus:
    enabled: true
    port: 8080
    path: /metrics
