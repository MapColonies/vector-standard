name: Push Artifacts to Azure Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing git tag to build and push (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  DOMAIN: vector
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  push-docker-image:
    runs-on: ubuntu-latest

    strategy:
      max-parallel: 1
      matrix:
        include:
          - package: api
            dockerfile: ./packages/api/Dockerfile
            image: standard-api
          - package: synchronizer
            dockerfile: ./packages/synchronizer/Dockerfile
            image: standard-synchronizer

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_URL }}
          username: ${{ secrets.ACR_PUSH_USER }}
          password: ${{ secrets.ACR_PUSH_TOKEN }}

      - name: Build and Push Docker image
        id: build_and_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ secrets.ACR_URL }}/${{ env.DOMAIN }}/${{ matrix.image }}:${{ env.TAG }}

      - name: Update Docker Image in artifacts.json
        uses: MapColonies/shared-workflows/actions/update-artifacts-file@update-artifacts-file-v1
        with:
          domain: ${{ env.DOMAIN }}
          type: docker
          artifact_name: ${{ matrix.image }}
          artifact_tag: ${{ env.TAG }}
          registry: ${{ secrets.ACR_URL }}
          github_token: ${{ secrets.GH_PAT }}

  push-helm-package:
    runs-on: ubuntu-latest
    needs: push-docker-image
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Remove v from the tag
        id: remove_v
        run: echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Push Chart to ACR
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: ${{ github.event.repository.name }}
          repository: helm/${{ env.DOMAIN }}
          tag: ${{ steps.remove_v.outputs.version }}
          path: ./helm
          registry: ${{ secrets.ACR_URL }}
          registry_username: ${{ secrets.ACR_PUSH_USER }}
          registry_password: ${{ secrets.ACR_PUSH_TOKEN }}
          update_dependencies: 'true'

      - name: Update Helm Package in artifacts.json
        uses: MapColonies/shared-workflows/actions/update-artifacts-file@update-artifacts-file-v1
        with:
          domain: ${{ env.DOMAIN }}
          type: helm
          artifact_name: ${{ github.event.repository.name }}
          artifact_tag: ${{ steps.remove_v.outputs.version }}
          registry: ${{ secrets.ACR_URL }}
          github_token: ${{ secrets.GH_PAT }}
